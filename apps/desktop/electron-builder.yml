appId: sh.mjolnir.app
productName: Mjolnir
copyright: Copyright © 2026 Aman Jain
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/**/*
  - package.json
  - '!**/*.map'
extraResources:
  # The built web client, served by the local server inside the app.
  - from: ../web/dist
    to: web
extraMetadata:
  main: dist/main.js
# The update feed sits on the API host rather than one of its own. It is a
# directory of files served by the process that is already there, so this is
# one less hostname, one less certificate and one less thing to be down while
# everything else is fine. Still *.mjolnir.sh, so a network that allows only
# that can still update the app.
publish:
  - provider: generic
    url: https://api.mjolnir.sh/updates/${channel}/${os}/${arch}
    channel: stable
    useMultipleRangeRequest: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip is what electron-updater downloads for a delta-free in-place update.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
dmg:
  title: Mjolnir ${version}
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
win:
  target: nsis
linux:
  target: [AppImage, deb]
  category: Development

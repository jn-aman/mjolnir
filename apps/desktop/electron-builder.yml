appId: sh.mjolnir.app
productName: Mjolnir
copyright: Copyright © 2026 Aman Jain
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - build/**/*
  - package.json
  - '!**/*.map'
extraResources:
  # The built web client, served by the local server inside the app.
  - from: ../web/dist
    to: web
extraMetadata:
  main: dist/main.js
# The update feed is our own domain, so a network that allows *.mjolnir.sh and
# nothing else can still update the app. ${channel} and the platform path are
# filled in by the updater at runtime.
publish:
  - provider: generic
    url: https://updates.mjolnir.sh/${channel}/${os}/${arch}
    channel: stable
    useMultipleRangeRequest: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip is what electron-updater downloads for a delta-free in-place update.
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  darkModeSupport: true
dmg:
  title: Mjolnir ${version}
  contents:
    - x: 140
      y: 180
      type: file
    - x: 400
      y: 180
      type: link
      path: /Applications
win:
  target: nsis
linux:
  target: [AppImage, deb]
  category: Development

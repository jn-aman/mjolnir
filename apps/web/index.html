<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mjolnir</title>
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
  </head>
  <body>
    <script>
      // Applied before first paint. Without this the document renders in one
      // theme and React switches it on mount, which is a visible flash on every
      // launch, the most noticeable rough edge a themed app can ship with.
      (function () {
        try {
          var choice = localStorage.getItem('mjolnir.theme') || 'system';
          var resolved =
            choice === 'system'
              ? window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
              : choice;
          document.documentElement.dataset.theme = resolved;
        } catch (_) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <!--
      The boot splash.

      Between the window opening and React's first paint there is an empty
      document, and on a cold start with a slow kubeconfig that gap is long
      enough to look like a failure. This is the app's own mark on the app's own
      background, already in the right theme because the script above ran, and
      React paints over it. Nothing here is interactive and nothing here can
      fail; it is markup and one keyframe.
    -->
    <div id="boot" aria-hidden>
      <div class="boot-mark">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="currentColor">
          <path fill-rule="evenodd" clip-rule="evenodd" d="M3.4 6.1A2.1 2.1 0 0 1 5.5 4h13A2.1 2.1 0 0 1 20.6 6.1v3.3A2.1 2.1 0 0 1 18.5 11.5h-13A2.1 2.1 0 0 1 3.4 9.4V6.1Zm9.7.4-3 3.1h1.9l-.5 1.9 3-3.2h-1.9l.5-1.8Z"/>
          <path d="M10.6 12.6h2.8v7.5a1.4 1.4 0 0 1-2.8 0v-7.5Z"/>
        </svg>
      </div>
      <div class="boot-word">Mjolnir</div>
    </div>
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--surface-ground, #fbfcfe);
        z-index: 200;
        animation: boot-out 0.24s ease-out 0.05s both;
      }
      [data-theme='dark'] #boot { background: #0a0d14; }
      .boot-mark {
        width: 48px;
        height: 48px;
        border-radius: 15px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        background: linear-gradient(145deg, #7d9aff, #2f52d8);
        box-shadow: 0 1px 0 rgb(255 255 255 / 0.25) inset, 0 10px 28px rgb(47 82 216 / 0.42);
        animation: boot-pulse 1.7s ease-in-out infinite;
      }
      .boot-word {
        font: 600 13px/1 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: 0.01em;
        color: #6b7385;
      }
      @keyframes boot-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
      @keyframes boot-out { from { opacity: 1; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .boot-mark { animation: none; } }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

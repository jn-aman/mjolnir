name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Fails if any .js/.cjs/.mjs source appears, then typechecks every
      # package under strict TypeScript, then runs the unit tests.
      - run: npm run verify

  e2e:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run build

      # Drives the real Electron app against the built-in demo cluster, so no
      # kubeconfig or network access is needed.
      - run: npm run e2e
        env:
          CI: 'true'

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
